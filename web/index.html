<meta name="description" content="세포 자동자를 브라우저에서 바로 돌려 보고, 태어남·살아남음 숫자를 바꿔 나만의 규칙을 만들어요.">
<meta name="theme-color" content="#f3f3f0">

<meta property="og:title" content="Grid Game — 격자 게임">
<meta property="og:description" content="세포 자동자를 돌려 보고 규칙을 직접 만들어요.">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<script>
  // 그리기 전에 밝은·어두운 화면을 정한다(번쩍임을 막는다). js/ui/theme.js 의 applyScheme 과 같은 판단
  (function () {
    var s = "system", d = false;
    try { s = JSON.parse(localStorage.getItem("grid.scheme")) || "system"; } catch (e) {}
    try { d = s === "dark" || (s !== "light" && matchMedia("(prefers-color-scheme: dark)").matches); } catch (e) {}
    document.documentElement.dataset.scheme = d ? "dark" : "light";
    document.querySelector('meta[name="theme-color"]').content = d ? "#111214" : "#f3f3f0";
  })();
</script>
